[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tts-plugin-bridge"
version = "0.1.0"
description = "TTSプラグインの動的発見・管理・Agent連携のためのコアフレームワーク"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tts-plugin-aivisspeech",
    "tts-plugin-edgetts",
    "vox4ai-skill",
]
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
tts-plugin-bridge = "tts_plugin_bridge.skill:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.uv.sources]
tts-plugin-aivisspeech = { path = "../tts-plugin-aivisspeech" }
tts-plugin-edgetts = { path = "../tts-plugin-edgetts" }
vox4ai = { path = "../vox4ai", editable = true }
vox4ai-skill = { path = "../vox4ai-skill", editable = true }


